*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans)}
.graphic{max-width:1400px;margin:0 auto}
.stage{position:relative;height:100vh;height:100dvh;min-height:560px;background:#dfebec;overflow:hidden}
#map{position:absolute;inset:0}

/* floating headline card */
.card{position:absolute;left:18px;bottom:68px;width:250px;background:#f9faf3;border:1px solid rgba(0,0,0,.07);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 32px -8px rgba(30,30,20,.28);padding:13px 15px 11px;z-index:3}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 7px;font:600 9px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--line)}
h1{margin:0 0 10px;font:600 15.5px/1.2 var(--serif);letter-spacing:-.005em;text-wrap:balance}
.bar{display:flex;height:3px;margin:0 0 6px;gap:2px}
.bar span{display:block;height:100%;border-radius:1px}
.total{font:500 9.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.total b{color:var(--ink)}
.legend{display:grid;gap:0;margin:0 0 8px}
.row{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:4px 6px;margin:0 -6px;font:500 12px var(--sans);color:var(--ink);cursor:pointer;text-align:left;border-radius:2px;border-top:1px solid #e7e0cb}
.row:hover{background:#f1ecda}
.row:focus-visible{outline:2px solid var(--ink)}
.row i{width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid #f9faf3;box-shadow:0 0 0 1px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.25);flex:none}
.row em{font-style:normal;flex:1}
.row b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.row[aria-pressed="false"]{opacity:.38}
.row[aria-pressed="false"] i{background:#fff}
.hint{margin:0;font:400 10.5px/1.4 var(--sans);color:var(--muted);padding-top:2px}
.hint a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}


/* popup */
.maplibregl-popup{max-width:none!important;pointer-events:none;z-index:6}
.maplibregl-popup-content{width:252px;padding:6px 6px 12px!important;border-radius:2px!important;box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 40px -10px rgba(30,30,20,.4)!important;font-family:var(--sans)}
.maplibregl-popup-tip{display:none}
.pp>h3,.pp>p,.pp>.tag{margin-left:8px;margin-right:8px}
.ph{aspect-ratio:1/1;background:#eeece3;display:flex;align-items:center;justify-content:center;color:#8a8470;font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pp h3{margin-top:11px;margin-bottom:2px;font:600 17px/1.2 var(--serif)}
.pp p{margin-top:0;margin-bottom:8px;font:400 12.5px/1.35 var(--sans);color:var(--muted)}
.tag{display:flex;align-items:center;gap:7px;font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.stl{font:600 12px var(--sans);color:#111;letter-spacing:.01em;pointer-events:none;white-space:nowrap;text-shadow:0 0 3px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.95);z-index:0}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.7)!important}
.maplibregl-ctrl-group{border-radius:2px!important;box-shadow:0 1px 2px rgba(0,0,0,.1),0 6px 16px -4px rgba(30,30,20,.25)!important}

#diag{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:9;max-width:80%;background:#fff;border:1px solid var(--line);padding:8px 12px;font:12px/1.4 var(--sans);color:#8a2a1a;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.src{position:absolute;left:18px;bottom:10px;z-index:3;max-width:min(520px,60%);font:400 11px/1.45 var(--sans);color:#33403f;text-shadow:0 0 3px rgba(255,255,255,.6)}
.src p{margin:0 0 1px}
.foot{padding:10px 18px 24px;font:400 12px/1.5 var(--sans);color:var(--muted)}
.foot p{margin:0 0 2px}

@media (max-width:760px){
  .stage{height:auto;min-height:0;display:flex;flex-direction:column;background:#fff}

  #map{position:relative;inset:auto;height:70vh;min-height:420px}
  .src{position:static;max-width:none;padding:8px 16px 18px;color:var(--muted);text-shadow:none}
}

      {type:"Feature",properties:{k:"state"},geometry:st},{type:"Feature",properties:{k:"nation"},geometry:nat}]}});
    map.addLayer({id:"us-state",type:"line",source:"uslines",filter:["==",["get","k"],"state"],
      paint:{"line-color":"#8c8a80","line-width":["interpolate",["linear"],["zoom"],3,0.45,8,1.1]}},"pts-shadow");
    map.addLayer({id:"us-nation",type:"line",source:"uslines",filter:["==",["get","k"],"nation"],
      paint:{"line-color":"#6a665a","line-width":["interpolate",["linear"],["zoom"],3,0.7,8,1.5]}},"pts-shadow");
    ["b-state","b-country"].forEach(function(id){if(map.getLayer(id))map.setLayoutProperty(id,"visibility","none")});
  }).catch(function(err){console.error("US lines failed to load; keeping default borders",err)});
  map.addSource("monuments",{type:"geojson",data:GEO});
  map.addLayer({id:"pts-shadow",type:"circle",source:"monuments",paint:{"circle-radius":sized(4.5,6.5,9,2.6),"circle-color":"rgba(20,20,10,.45)","circle-blur":0.9,"circle-translate":[0,1.5],"circle-opacity":0.6}});
  map.addLayer({id:"pts-halo",type:"circle",source:"monuments",
    paint:{"circle-radius":sized(4.5,6.5,9,2.2),"circle-color":"#ffffff","circle-opacity":0.95}});
  map.addLayer({id:"pts",type:"circle",source:"monuments",
    paint:{"circle-radius":sized(4.5,6.5,9,0),"circle-color":["get","color"],"circle-stroke-width":0}});
  map.on("mousemove","pts",function(e){
    map.getCanvas().style.cursor="pointer";
    var f=e.features[0];if(!f)return;
    if(hoverId!==f.id){setHover(hoverId,false);hoverId=f.id;setHover(hoverId,true);showPop(f.id,f.geometry.coordinates.slice())}});
  map.on("mouseleave","pts",function(){map.getCanvas().style.cursor="";setHover(hoverId,false);hoverId=null;popup.remove()});
  map.on("click","pts",function(e){var f=e.features[0];if(f)showPop(f.id,f.geometry.coordinates.slice())});
  map.on("click",function(e){if(!map.queryRenderedFeatures(e.point,{layers:["pts"]}).length)popup.remove()});
});



})();
</script>
</body>
</html>
